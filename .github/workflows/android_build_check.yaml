name: Android Build Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Restore google-services.json files
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p androidApp/src/debug data
          decode() {
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$1" || \
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > "$1"
          }
          decode androidApp/google-services.json
          decode androidApp/src/debug/google-services.json
          decode data/google-services.json

      - name: Run Tests
        run: ./gradlew test

      - name: Build Debug
        run: ./gradlew assembleDebug

      - name: Build Release
        run: ./gradlew assembleRelease

      - name: Lint
        run: ./gradlew lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
          retention-days: 7
